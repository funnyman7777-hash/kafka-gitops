apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:funnyman7777-hash/kafka-gitops.git
    targetRevision: HEAD
    path: manifests
    helm: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
