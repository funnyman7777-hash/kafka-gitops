apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-token
  namespace: vault
spec:
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: vault-token
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: secret/data/vault-token
