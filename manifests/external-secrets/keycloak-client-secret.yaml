apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client-secret
  namespace: kafka
spec:
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: keycloak-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: secret/data/keycloak/client
        property: client-secret
