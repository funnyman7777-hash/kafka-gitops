apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: strimzi
spec:
  kafka:
    version: 3.6.0
    replicas: 4
    listeners:
      - name: external
        port: 9094
        type: nodeport
        tls: true
        authentication:
          type: oauth
          clientId: kafka-client
          clientSecret:
            secretName: keycloak-client-secret
            key: client-secret
          tokenEndpointUri: http://keycloak.keycloak.svc.cluster.local:8080/realms/master/protocol/openid-connect/token
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          class: standard
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
      class: standard
  entityOperator:
    topicOperator: {}
    userOperator: {}
