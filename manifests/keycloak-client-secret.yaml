apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-client-secret
  namespace: strimzi
spec:
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: keycloak-client-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/keycloak/client
